<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Should I Evolve This Pokémon?</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Should I Evolve This Pokémon?</h1>
            <p>Select or search for a Pokémon to analyze its stats before and after evolution!</p>
        </header>

        <div class="search-section">
            <input type="text" id="pokemonSearch" placeholder="Search Pokémon (e.g., Pikachu, Bulbasaur)..." list="pokemonList">
            <datalist id="pokemonList"></datalist>
            <button id="analyzeBtn">Analyze Evolution</button>
        </div>

        <div id="resultContainer" class="hidden">
            <div class="comparison-card">
                <div class="pokemon-box" id="currentPokemonBox">
                    <h2>Current Pokémon</h2>
                    <div class="img-container"><img id="currImg" src="" alt=""></div>
                    <h3 id="currName"></h3>
                    <p id="currTypes"></p>
                    <ul class="stats-list" id="currStats"></ul>
                </div>

                <div class="vs-arrow">➔</div>

                <div class="pokemon-box" id="evolutionPokemonBox">
                    <h2>Evolved Form</h2>
                    <div class="img-container"><img id="evoImg" src="" alt=""></div>
                    <h3 id="evoName"></h3>
                    <p id="evoTypes"></p>
                    <ul class="stats-list" id="evoStats"></ul>
                </div>
            </div>

            <div class="verdict-box" id="verdictBox">
                <h2>Verdict</h2>
                <p id="verdictText"></p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
