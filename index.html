<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Should I Evolve This Pokémon?</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
</head>
<body>
    <div class="app-background"></div>
    <div class="container">
        <header>
            <h1>⚡ Should I Evolve This Pokémon? ⚡</h1>
            <p>Analyze your Pokémon's stats, types, and power progression before pressing evolve!</p>
        </header>

        <div class="search-section">
            <div class="search-box">
                <input type="text" id="pokemonSearch" placeholder="Type Pokémon name (e.g. Pikachu, Charmander)..." list="pokemonList" autocomplete="off">
                <datalist id="pokemonList"></datalist>
                <button id="analyzeBtn">Analyze</button>
            </div>
        </div>

        <div id="resultContainer" class="hidden">
            <div class="comparison-card">
                <!-- Current Pokémon -->
                <div class="pokemon-card" id="currentCard">
                    <div class="card-header">
                        <h2>Current</h2>
                        <span class="badge" id="currTypeBadge"></span>
                    </div>
                    <div class="img-container">
                        <img id="currImg" src="" alt="Current Pokémon">
                    </div>
                    <h3 id="currName"></h3>
                    <div class="stats-container" id="currStats"></div>
                </div>

                <!-- VS Arrow Divider -->
                <div class="vs-divider">
                    <div class="vs-circle">VS</div>
                </div>

                <!-- Evolved Pokémon -->
                <div class="pokemon-card" id="evolutionCard">
                    <div class="card-header">
                        <h2>Evolved</h2>
                        <span class="badge" id="evoTypeBadge"></span>
                    </div>
                    <div class="img-container">
                        <img id="evoImg" src="" alt="Evolved Pokémon">
                    </div>
                    <h3 id="evoName"></h3>
                    <div class="stats-container" id="evoStats"></div>
                </div>
            </div>

            <div class="verdict-box" id="verdictBox">
                <h3>Evolution Verdict</h3>
                <p id="verdictText"></p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
